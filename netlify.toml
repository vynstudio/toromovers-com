# NOTE: deliberately NO /manifest.webmanifest proxy — public/manifest.webmanifest must win.

# /tip and /tip/thanks are Astro endpoints (307), not edge redirects.
# An edge rule would also swallow /tip/ and skip the 308 trailing-slash hop
# that live Next.js returns. See src/pages/tip/.
# Trailing-slash 308s live in netlify/edge-functions/searchable.ts.
# A toml rule from "/*/" to "/:splat" is rejected as a redirect loop.

# Security headers on every CDN path. Netlify does not copy these onto
# function responses, so SSR and API routes get the same values from
# src/middleware.ts (src/lib/security-headers.ts). Keep the two in sync.
# Enforced CSP is frame-ancestors alone so it does not clash with report-only.
# script-src 'unsafe-inline' is temporary: consent, JSON-LD, gtag, and the
# homepage handlers are inline scripts. Astro inlines stylesheets, so
# style-src also allows 'unsafe-inline'.
# Mapbox is fetched server-side by /api/address-suggest, not from the browser.
# Fonts, images, and video are same-origin. Searchable beacons go to
# tracker.searchableanalytics.com. No separate Netlify origin is loaded.
# HSTS replaces Netlify's default max-age=31536000. No preload.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(self \"https://js.stripe.com\"), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://*.js.stripe.com https://m.stripe.network https://*.m.stripe.network https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com https://connect.facebook.net https://searchable-tracker.searchable.workers.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.facebook.com https://www.google.com https://www.google-analytics.com https://ssl.google-analytics.com https://www.googletagmanager.com https://*.stripe.com; font-src 'self' data:; connect-src 'self' https://api.stripe.com https://m.stripe.com https://m.stripe.network https://q.stripe.com https://r.stripe.com https://merchant-ui-api.stripe.com https://checkout.stripe.com https://hooks.stripe.com https://*.stripe.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net https://www.facebook.com https://connect.facebook.net https://searchable-tracker.searchable.workers.dev https://tracker.searchableanalytics.com; frame-src 'self' https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://m.stripe.network https://*.m.stripe.network https://*.stripe.com https://www.google.com https://www.facebook.com https://app.netlify.com; media-src 'self' blob:; worker-src 'self' blob: https://m.stripe.network https://*.m.stripe.network; report-uri /api/csp-report"

[[headers]]
