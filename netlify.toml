# =============================================================================
# live-toro-site builds THIS repo (vynstudio/toromovers-com) and owns
# toromovers.com. Do NOT 200-rewrite routes this Next app serves onto
# live-toro-site.netlify.app — that is the same site and Netlify 404s.
# =============================================================================

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_SITE_URL = "https://toromovers.com"

# www → apex
[[redirects]]
  from = "https://www.toromovers.com/*"
  to = "https://toromovers.com/:splat"
  status = 301
  force = true

# Legacy brand domains
[[redirects]]
  from = "https://toromovers.net/*"
  to = "https://toromovers.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.toromovers.net/*"
  to = "https://toromovers.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://toromudanzas.com/*"
  to = "https://toromovers.com/?utm_source=toromudanzas&utm_medium=redirect"
  status = 301
  force = true

[[redirects]]
  from = "https://www.toromudanzas.com/*"
  to = "https://toromovers.com/?utm_source=toromudanzas&utm_medium=redirect"
  status = 301
  force = true

# /api/lead is owned by this Next app (src/app/api/lead). Do not proxy it.
# Former engine API/funnel 200-proxies (/api/crm, /api/intake, /bookings, etc.)
# were verified 404 on live-toro-site.netlify.app (GET+POST) — removed.
# Re-add only if a separate engine host is restored.

