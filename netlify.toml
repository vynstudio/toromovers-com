# =============================================================================
# Hybrid hosting: DESIGN owns toromovers.com homepage + legal pages.
# SEO / funnel / CRM engine proxies to live-toro-site (status 200 rewrite).
# Engine assetPrefix points at live-toro-site.netlify.app for /_next assets.
# =============================================================================

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_SITE_URL = "https://toromovers.com"

# www → apex
[[redirects]]
  from = "https://www.toromovers.com/*"
  to = "https://toromovers.com/:splat"
  status = 301
  force = true

# Legacy brand domains (moved with this site)
[[redirects]]
  from = "https://toromovers.net/*"
  to = "https://toromovers.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.toromovers.net/*"
  to = "https://toromovers.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://toromudanzas.com/*"
  to = "https://toromovers.com/?utm_source=toromudanzas&utm_medium=redirect"
  status = 301
  force = true

[[redirects]]
  from = "https://www.toromudanzas.com/*"
  to = "https://toromovers.com/?utm_source=toromudanzas&utm_medium=redirect"
  status = 301
  force = true

# --- Engine: APIs & funnels ---
