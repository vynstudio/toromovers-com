[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_SITE_URL = "https://toromovers.com"

# SEO: force apex domain (www → non-www)
[[redirects]]
  from = "https://www.toromovers.com/*"
  to = "https://toromovers.com/:splat"
  status = 301
  force = true
