# =============================================================================
# live-toro-site builds THIS repo (vynstudio/toromovers-com) and owns
# toromovers.com. Do NOT 200-rewrite routes this Next app serves onto
# live-toro-site.netlify.app — that is the same site and Netlify 404s.
# =============================================================================

[build]
  command = "npm run build"
  publish = "dist"

# Astro + @astrojs/netlify. Do not install @netlify/plugin-nextjs: it would
# serve the old Next runtime over this site.

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_SITE_URL = "https://toromovers.com"
  # The site still has the Next.js runtime installed in the Netlify UI.
  # This branch does not change that setting. The variable tells that
  # plugin to skip so this Astro build can publish dist/.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# toromovers.net aliases → apex in one hop.
# http and https are separate rules (Netlify does not combine them).
# The https counterparts are the next legacy-domain rules. Host is part of
# `from`, so toromovers.com is not matched. force = true beats the Next.js
# runtime, which would otherwise serve this app on the alias. `to` has no
# query string, so Netlify forwards the original query string.
[[redirects]]
  from = "http://toromovers.net/*"
  to = "https://toromovers.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.toromovers.net/*"
  to = "https://toromovers.com/:splat"
  status = 301
  force = true

# www → apex
[[redirects]]
  from = "https://www.toromovers.com/*"
  to = "https://toromovers.com/:splat"
  status = 301
  force = true

